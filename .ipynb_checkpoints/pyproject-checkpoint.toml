[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lqsig"
version = "0.1.0"
description = "Signature methods for linear-quadratic stochastic control: N-dimensional extension, fBM drivers and neural benchmarks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
notebooks = ["jupyter"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
